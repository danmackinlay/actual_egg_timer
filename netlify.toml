# A static site: `npm run build:site` (tools/buildSite.ts) builds it into
# _site/, with the service worker that lists all of it (sw.js,
# tools/precache.ts) written last.

[build]
  command = "npm run build:site"
  publish = "_site"

# The collection endpoint for cooks who turn sharing on (INFERENCE.md
# section 7): netlify/functions/eggs.mts binds server/eggs.ts to the site's
# Blobs store. Netlify bundles it from source, so `build:site` does not. Its
# routes and rate limit are in the function's own `config`, the only place
# Netlify reads a function's rate limit from.
[functions]
  directory = "netlify/functions"

# Node's version is in .node-version, which nvm, fnm and Netlify all read.
# NODE_VERSION set here would silently override it, so it is not set.

# The scripts are named for their contents (bundle/main-<hash>.js), so a
# browser may keep one for a year. Never mark /app/* or /dist/* immutable:
# earlier builds served fixed-name scripts there, and a browser may still
# hold them.
[[headers]]
  for = "/bundle/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The words keep their names across deploys, so they are revalidated on every
# load: a year's cache would run this build's scripts against another build's
# catalogue. Netlify's edge answers the revalidation with a 304. Netlify's
# default too; written out so that nobody adds the year back.
[[headers]]
  for = "/copy/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icons and the social card keep their filenames when the artwork changes:
# a day, not a year, and no immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The page itself, under both the names it is asked for by.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The service worker: how the browser learns of the next build. Once a
# browser has it, the page and everything above come from the build it
# keeps, not from these headers. A change to any header in this file is a new
# build too (tools/precache.ts).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The page has no inline script, style or event handler, and loads only
# same-origin resources (the slider's shading is set through element.style,
# which a CSP does not govern), so a strict policy costs nothing and anything
# it blocks is a regression. The wake lock (the screen stays on while a cook
# runs) is the one powerful feature it uses.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "screen-wake-lock=(self), camera=(), microphone=(), geolocation=(), payment=(), usb=()"

