# The app is static: TypeScript compiled to ES modules, no bundler, no runtime
# dependencies. `npm run build:site` compiles src/ and copies the two static
# files next to it, so that index.html's <script src="dist/src/ui/main.js">
# resolves identically whether you are serving _site/ or the repo root.

[build]
  command = "npm run build:site"
  publish = "_site"

# Node version lives in .node-version, not here: one file, which nvm, fnm and
# Netlify all read, so the deploy builds on the same Node the tests ran on.
# Netlify's own default is 24 as of July 2026; NODE_VERSION set here would
# silently override the file, so it deliberately is not set.

# Everything is immutable per deploy except the entry point.
[[headers]]
  for = "/dist/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Icons and the social card change only when the artwork does, but they keep
# their filenames when they do - so a day, not a year, and no immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
