# The app is static: TypeScript compiled to ES modules, no bundler, no runtime
# dependencies. `npm run build:site` compiles src/ and copies the static files
# next to it - the page, the styles, the artwork, the words in copy/ and the
# privacy page (privacy/index.html, so /privacy finds it on any host) - so
# that index.html's <script src="dist/src/ui/main.js"> and the scripts' fetch
# of copy/en.json resolve identically whether you are serving _site/ or the
# repo root.

[build]
  command = "npm run build:site"
  publish = "_site"

# Node version lives in .node-version, not here: one file, which nvm, fnm and
# Netlify all read, so the deploy builds on the same Node the tests ran on.
# Netlify's own default is 24 as of July 2026; NODE_VERSION set here would
# silently override the file, so it deliberately is not set.

# The scripts and the words are revalidated on every load, not cached for a
# year. They keep their names across deploys - dist/src/ui/main.js is
# dist/src/ui/main.js in every build, because there is no bundler to hash them -
# so "immutable" here would be a false promise: a returning browser would run
# last month's modules against this month's index.html, or a mix of old and
# new, since every import is its own cache entry. The page assumes the scripts,
# the worker they start (gridWorker.js) and copy/*.json all came from one
# build; the per-egg record and the catalogue keys both depend on it.
#
# The other fix is to version the paths per deploy (dist/<commit>/...) and
# rewrite index.html's <script src> at build time. It would let these be
# immutable, but it adds a rewriting step to a build that is otherwise tsc and
# cp, for a couple of dozen small files. Revalidating costs one conditional
# request per file, which Netlify's edge answers with a 304 from its own cache;
# the edge copy is purged on every deploy, so only the browser's copy needed
# fixing.
#
# This is also Netlify's default for a file with no rule; it is written out so
# that nobody adds the year back.
# The published site serves the scripts from /app/, not /dist/ (the build
# rewrites index.html's one <script src>; serving the repo root still uses
# dist/). The 19 September site sent /dist/* as immutable for a year, so a
# browser that visited then would keep running those modules against new
# ones; a path it has never cached cannot be stale. Never mark /app/*
# immutable for the same reason.
[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/copy/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icons and the social card change only when the artwork does, but they keep
# their filenames when they do - so a day, not a year, and no immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The page itself, under both the names it is asked for by.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers, on everything. The page has no inline script, style or
# event handler: one module script, one same-origin worker (gridWorker.js),
# same-origin fetches of copy/*.json, styles.css, and images from assets/. The
# slider's shading is set through element.style from script, which a CSP does
# not govern. So a strict policy costs nothing, and anything it blocks is a
# regression worth hearing about. The wake lock (the screen stays on while a
# cook runs) is the one powerful feature the page uses.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "screen-wake-lock=(self), camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# vercel.json sets no cache headers, and needs none: Vercel sends this same
# "public, max-age=0, must-revalidate" for static files by default, and purges
# its edge per deploy. Do not add an immutable rule there either. It does
# carry the security headers above, in its own format; keep the two alike.
