<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>copy snapshot</title>
<!--
  Every word the web app puts on screen, in every state worth reaching.

  It is the proof that a change touched no wording: run it against the build
  before and the build after, and the two outputs must be identical. It is also
  the proof that a rewrite changed ONLY the strings it meant to:
  `copySnapshot.js compare --draft` holds the two outputs to tools/copyDraft.ts
  instead of to each other. The steps below also work on older builds that
  asked one question, then maybe a second. It drives the real app, unmodified,
  in an iframe. It touches Date.now, which it freezes and then steps, because
  the cook machine is a pure function of it; Math.random, which it seeds, for
  the nudge; and setTimeout, Worker and fetch, which it only counts, so that
  every step waits for the app to settle (`settle`): no short timer pending,
  no worker job and no request out. Without that wait a tap could land before
  a solve did - the second cook started on the mean solve's time or on the
  decided one, with the certainty lines or without, as the machine ran - and
  two captures of one build differed. With it every state is reproducible,
  including the countdowns and the sous-vide wall clock.

  It captures, for each state:
    - body.innerText, which is what is rendered and visible;
    - every text node in the body, whitespace collapsed, visible or not, so a
      string sitting in a hidden element is compared too;
    - aria-valuetext, aria-label, title, placeholder and alt attributes;
    - <html lang> and document.title.

  Run it:
    npm run build
    python3 -m http.server 8391            # from the repo root
    open http://localhost:8391/tools/copy-snapshot.html
  or headless, which is what `node dist/tools/copySnapshot.js` does.
  The result is in <pre id="out">, URI-encoded JSON, when <title> says "done".
-->
<style>body { font: 13px system-ui; } iframe { width: 390px; height: 844px; border: 1px solid #888; }</style>
</head>
<body>
<p id="status">running…</p>
<pre id="out"></pre>
<script>
'use strict';

/** A fixed instant, so the sous-vide wall clock and every countdown are the
 *  same on every run. A Saturday morning. */
const T0 = new Date(2026, 8, 26, 7, 30, 0).getTime();

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

let frame = null;
let html = null;
/** navigator.language for the app in the frame. It picks the carton's size
 *  classes (region US gets the American ones), so it is pinned rather than
 *  left to whatever browser runs this. */
let language = 'en-GB';

/** Run in the frame before the app: what it has in hand, counted in
 *  `window.__busy`. A timer is counted only if it is short - the solve's and
 *  the settings' coalescing, the decision's settle, a job run on this thread -
 *  and not a request's 20-s timeout or a download's 10-s cleanup. The grid
 *  worker answers each message once (gridWorker.ts). Math.random is seeded,
 *  so the nudge (answer.ts) is the same on every run. */
function instrument(w) {
  const busy = { timers: new Set(), jobs: 0, fetches: 0 };
  w.__busy = busy;
  const set = w.setTimeout.bind(w);
  const clear = w.clearTimeout.bind(w);
  w.setTimeout = function (f, ms, ...args) {
    const id = set(() => {
      busy.timers.delete(id);
      f(...args);
    }, ms);
    if (!(ms > 2000)) busy.timers.add(id);
    return id;
  };
  w.clearTimeout = function (id) {
    busy.timers.delete(id);
    clear(id);
  };
  if (typeof w.Worker === 'function') {
    w.Worker = class extends w.Worker {
      constructor(url, options) {
        super(url, options);
        this.addEventListener('message', () => { busy.jobs = Math.max(0, busy.jobs - 1); });
        this.addEventListener('error', () => { busy.jobs = 0; });
      }
      postMessage(...args) {
        busy.jobs += 1;
        super.postMessage(...args);
      }
      terminate() {
        busy.jobs = 0;
        super.terminate();
      }
    };
  }
  const get = w.fetch.bind(w);
  w.fetch = function (...args) {
    busy.fetches += 1;
    return get(...args).finally(() => { busy.fetches -= 1; });
  };
  let seed = 0x2545f491;
  w.Math.random = function () {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Wait until the app has nothing in hand (`instrument`) for three looks in a
 *  row, so a solve, a surface or a fold that a step set off has landed and been
 *  drawn before the next step or the snapshot. A minute without that is a
 *  failure, not a snapshot of whatever was there. */
async function settle() {
  let quiet = 0;
  for (let i = 0; i < 1200; i++) {
    const busy = win().__busy;
    if (busy.timers.size === 0 && busy.jobs === 0 && busy.fetches === 0) {
      quiet += 1;
      if (quiet === 3) return;
    } else {
      quiet = 0;
    }
    await sleep(50);
  }
  const busy = win().__busy;
  throw new Error(`the app did not settle: ${busy.timers.size} timers, ${busy.jobs} jobs, ${busy.fetches} requests`);
}

async function openApp(now) {
  if (html === null) {
    html = await (await fetch('../index.html', { cache: 'no-store' })).text();
  }
  if (frame !== null) frame.remove();
  const base = new URL('../', location.href).href;
  const inject = `<base href="${base}"><script>window.__now=${now};`
    + 'Date.now=function(){return window.__now;};'
    + `(${instrument})(window);`
    + `Object.defineProperty(navigator,'language',{value:'${language}'});<\/script>`;
  frame = document.createElement('iframe');
  document.body.append(frame);
  const doc = frame.contentDocument;
  doc.open();
  doc.write(html.replace('<head>', `<head>${inject}`));
  doc.close();
  // Booted means the phase label and the doneness reading are both painted,
  // whether that happened synchronously or after the catalogue was fetched.
  for (let i = 0; i < 200; i++) {
    const d = frame.contentDocument;
    const label = d && d.getElementById('phaseLabel');
    const value = d && d.getElementById('donenessPeak');
    if (label && label.textContent !== '' && value && value.textContent !== '') break;
    await sleep(25);
  }
  await sleep(400);
  await settle();
}

function win() { return frame.contentWindow; }
function doc() { return frame.contentDocument; }

function snap(name) {
  const d = doc();
  const texts = [];
  const walker = d.createTreeWalker(d.body, NodeFilter.SHOW_TEXT);
  for (let n = walker.nextNode(); n !== null; n = walker.nextNode()) {
    if (n.parentElement && n.parentElement.tagName === 'SCRIPT') continue;
    const s = n.nodeValue.replace(/\s+/g, ' ').trim();
    if (s !== '') texts.push(s);
  }
  const attrs = [];
  for (const el of d.querySelectorAll('*')) {
    for (const a of ['aria-valuetext', 'aria-label', 'title', 'placeholder', 'alt']) {
      if (el.hasAttribute(a)) attrs.push(`${el.id || el.tagName.toLowerCase()} ${a}=${el.getAttribute(a)}`);
    }
  }
  return {
    name: name,
    lang: d.documentElement.lang,
    title: d.title,
    innerText: d.body.innerText,
    texts: texts,
    attrs: attrs,
  };
}

/** The running cook's deadlines, epoch ms, read from the app in the frame:
 *  they are its plan's (src/core/running.ts), derived, not stored. The
 *  module is the frame's own instance, imported by the same URL. */
async function deadlines() {
  const url = new URL('../dist/src/ui/state.js', location.href).href;
  const m = await win().eval(`import(${JSON.stringify(url)})`);
  const d = m.state.plan.deadlines;
  return { cookEnd_ms: d.cookEnd_s * 1000, coolEnd_ms: d.coolEnd_s === null ? 0 : d.coolEnd_s * 1000 };
}

/* ------------------------------------------------------------------ steps */

const click = (sel) => ({ name: `click ${sel}`, run: async () => { doc().querySelector(sel).click(); await sleep(60); } });
const advance = (s) => ({ name: `+${s}s`, run: async () => { win().__now += s * 1000; await sleep(500); } });
const wait = (ms) => ({ name: `wait ${ms}`, run: async () => { await sleep(ms); } });
const toPull = { name: 'to pull', run: async () => { win().__now = (await deadlines()).cookEnd_ms + 3000; await sleep(500); } };
/** A countdown left at exactly `s` seconds, for the spoken forms. */
const toLeft = (s) => ({ name: `${s}s left`, run: async () => { win().__now = (await deadlines()).cookEnd_ms - s * 1000; await sleep(500); } });
const toCoolEnd = { name: 'to cool end', run: async () => { win().__now = (await deadlines()).coolEnd_ms + 1000; await sleep(500); } };
const reopen = { name: 'reload', run: async () => { await openApp(win().__now); } };
/** Wait until the feedback fold is done: no note says "learning…". */
const learned = {
  name: 'learned',
  run: async () => {
    for (let i = 0; i < 400; i++) {
      const note = doc().getElementById('calibNote').textContent;
      if (!note.includes('…')) break;
      await sleep(50);
    }
    await sleep(300);
  },
};

/* -------------------------------------------------------------- scenarios */

const cookThrough = [
  click('#primary'), advance(400), click('#primary'), advance(60), toPull,
  click('#primary'), toCoolEnd,
  click('button.fb[data-yolk="soft"]'), learned,
  click('button.wb[data-white="runny"]'), learned,
  click('#primary'),
];

const SCENARIOS = [
  { name: 'idle default', settings: {}, steps: [click('#mute')] },
  { name: 'idle hot', settings: { startMode: 'hot' }, steps: [] },
  { name: 'US carton', lang: 'en-US', settings: {}, steps: [] },
  { name: 'US carton, Jumbo', lang: 'en-US', settings: { sizeIndex: 4 }, steps: [] },
  { name: 'EU carton, stored Jumbo', settings: { sizeIndex: 4 }, steps: [] },
  { name: 'idle hot standing', settings: { startMode: 'hot', afterBoil: 'off' }, steps: [] },
  { name: 'idle cold standing', settings: { afterBoil: 'off' }, steps: [] },
  { name: 'idle soft', settings: { startMode: 'hot', doneness: 0.22 }, steps: [] },
  { name: 'idle fudgy', settings: { startMode: 'hot', doneness: 0.62 }, steps: [] },
  { name: 'idle hard', settings: { startMode: 'hot', doneness: 1 }, steps: [] },
  { name: 'idle runny hot', settings: { startMode: 'hot', doneness: 0 }, steps: [] },
  { name: 'refusal ice', settings: { sizeIndex: 0, startTempMode: 'room', waterLitres: 0.5, eggCount: 1, doneness: 0 }, steps: [] },
  { name: 'refusal tap', settings: { sizeIndex: 0, cooling: 'tap', waterLitres: 0.5, eggCount: 1, doneness: 0 }, steps: [] },
  { name: 'refusal counter', settings: { sizeIndex: 0, cooling: 'counter', waterLitres: 0.5, eggCount: 1, doneness: 0 }, steps: [] },
  { name: 'refusal hardest', settings: { sizeIndex: 3, afterBoil: 'off', waterLitres: 0.5, eggCount: 1, doneness: 1 }, steps: [] },
  { name: 'refusal hardest 0.75 L', settings: { sizeIndex: 0, afterBoil: 'off', waterLitres: 0.75, eggCount: 2, doneness: 1 }, boil: { '0.8': 300 }, steps: [] },
  { name: 'refusal hardest 1 L', settings: { sizeIndex: 0, afterBoil: 'off', waterLitres: 1, eggCount: 1, doneness: 1 }, boil: { '1.0': 300 }, steps: [] },
  { name: 'white never sets', settings: { sizeIndex: 0, startMode: 'hot', afterBoil: 'off', waterLitres: 0.5, eggCount: 1, doneness: 0 }, steps: [] },
  { name: 'custom temp, measured egg', settings: { startTempMode: 'custom', customStart_C: 15, sizeIndex: -1, customMinor_mm: 45 }, steps: [] },
  { name: 'room temp', settings: { startTempMode: 'room' }, steps: [] },
  { name: 'pan remembered', settings: {}, boil: { '2.0': 480 }, steps: [] },
  { name: 'pan remembered, hot standing', settings: { startMode: 'hot', afterBoil: 'off' }, boil: { '2.0': 480 }, steps: [] },
  { name: 'sous-vide jammy', settings: { startMode: 'sous' }, steps: [] },
  { name: 'sous-vide 0.8', settings: { startMode: 'sous', doneness: 0.8 }, steps: [] },
  { name: 'sous-vide 0.9', settings: { startMode: 'sous', doneness: 0.9 }, steps: [] },
  { name: 'sous-vide hard', settings: { startMode: 'sous', doneness: 1 }, steps: [] },
  // A time of day and numbers in a 12-hour, comma-grouped locale.
  { name: 'sous-vide jammy, en-US', lang: 'en-US', settings: { startMode: 'sous' }, steps: [] },
  { name: 'sous-vide hard, en-US', lang: 'en-US', settings: { startMode: 'sous', doneness: 1 }, steps: [] },
  // The spoken countdown at one of each, so "1 seconds" would show.
  {
    name: 'hot cook, spoken at 61 s and 1 s',
    settings: { muted: true, startMode: 'hot' },
    steps: [click('#primary'), toLeft(61), toLeft(60), toLeft(1)],
  },
  {
    name: 'cold cook, twice, then forget',
    settings: { muted: true },
    // Since the redesign, Forget asks first; before it, there is nothing to
    // confirm and the second step does nothing.
    steps: [...cookThrough, ...cookThrough, click('#forget'), click('#forgetYes')],
  },
  {
    // The note after an answer says thanks, and the count waits for the next
    // egg's questions (an older build said how many eggs). A third egg
    // is what puts "N eggs", plural, on screen again.
    name: 'cold cook, three times',
    settings: { muted: true },
    steps: [...cookThrough, ...cookThrough, ...cookThrough],
  },
  {
    name: 'cold cook, reloaded mid-cook',
    settings: { muted: true },
    steps: [click('#primary'), advance(30), reopen, click('#primary'), advance(30), reopen, toPull, reopen, click('#primary'), reopen, toCoolEnd, reopen],
  },
  {
    name: 'hot soft, tap, white question',
    settings: { muted: true, startMode: 'hot', cooling: 'tap', doneness: 0.22 },
    steps: [click('#primary'), advance(30), toPull, click('#primary'), toCoolEnd,
      click('button.fb[data-yolk="fudgy"]'), learned,
      click('button.wb[data-white="firm"]'), learned, click('#primary')],
  },
  {
    name: 'hot soft, the white alone, then a reload',
    settings: { muted: true, startMode: 'hot', doneness: 0.22 },
    steps: [click('#primary'), toPull, click('#primary'), toCoolEnd,
      click('button.wb[data-white="tender"]'), learned,
      reopen, click('#primary')],
  },
  {
    name: 'hot jammy, the white and then the yolk',
    settings: { muted: true, startMode: 'hot' },
    steps: [click('#primary'), toPull, click('#primary'), toCoolEnd,
      click('button.wb[data-white="firm"]'), learned,
      click('button.fb[data-yolk="jammy"]'), learned, click('#primary')],
  },
  {
    name: 'hot runny, white question',
    settings: { muted: true, startMode: 'hot', doneness: 0 },
    steps: [click('#primary'), toPull, click('#primary'), toCoolEnd,
      click('button.fb[data-yolk="jammy"]'), learned,
      click('button.wb[data-white="runny"]'), learned],
  },
  {
    name: 'hot counter',
    settings: { muted: true, startMode: 'hot', cooling: 'counter', doneness: 0.62 },
    steps: [click('#primary'), advance(30), toPull, click('#primary'),
      click('button.fb[data-yolk="jammy"]'), learned, click('#primary')],
  },
  {
    name: 'cold standing, through',
    settings: { muted: true, afterBoil: 'off', cooling: 'tap' },
    steps: [click('#primary'), advance(400), click('#primary'), advance(30), toPull, click('#primary'), toCoolEnd],
  },
  {
    name: 'cold standing, cancel',
    settings: { muted: true, afterBoil: 'off' },
    steps: [click('#primary'), advance(30), click('#primary'), advance(30), click('#secondary')],
  },
];

async function run() {
  const out = [];
  // ?only=<substring> runs the matching scenarios alone, for debugging.
  const only = new URLSearchParams(location.search).get('only');
  for (const sc of SCENARIOS.filter((x) => only === null || x.name.includes(only))) {
    localStorage.clear();
    language = sc.lang === undefined ? 'en-GB' : sc.lang;
    if (sc.settings !== undefined) localStorage.setItem('aet.settings.v1', JSON.stringify(sc.settings));
    if (sc.boil !== undefined) localStorage.setItem('aet.boil.v1', JSON.stringify(sc.boil));
    await openApp(T0);
    out.push(snap(`${sc.name} / start`));
    let i = 0;
    for (const step of sc.steps) {
      document.getElementById('status').textContent = `${sc.name}: step ${i + 1} ${step.name}`;
      await step.run();
      await settle();
      i += 1;
      out.push(snap(`${sc.name} / ${i} ${step.name}`));
    }
  }
  localStorage.clear();
  document.getElementById('out').textContent = encodeURIComponent(JSON.stringify(out));
  document.getElementById('status').textContent = `${out.length} states`;
  document.title = 'done';
}

run().catch((e) => {
  document.getElementById('status').textContent += ` failed: ${e && e.stack || e}`;
  document.title = 'failed';
});
</script>
</body>
</html>
