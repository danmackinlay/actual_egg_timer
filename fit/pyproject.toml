[project]
name = "eggfit"
version = "0.1.0"
description = "The population fit for Actual Egg Timer (E7; INFERENCE.md section 9): shared eggs in, fixtures/population.json out."
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "jax>=0.4.30",
    "numpyro>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eggfit"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
