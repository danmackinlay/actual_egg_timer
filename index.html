<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#111214">
<title>Actual Egg Timer</title>
<meta name="description" content="A boiled-egg timer that computes the time from physics instead of reciting it: heat conduction in a sphere, denaturation kinetics, and the cooling step treated as part of the cook.">
<link rel="stylesheet" href="styles.css">
<!-- Every word on the page is in copy/en.json; the page waits for it. -->
<link rel="preload" href="copy/en.json" as="fetch" crossorigin="anonymous">

<link rel="canonical" href="https://actualeggtimer.netlify.app/">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Actual Egg Timer">

<!-- Absolute URLs: most scrapers will not resolve a relative one. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Actual Egg Timer">
<meta property="og:title" content="Actual Egg Timer">
<meta property="og:description" content="Every recipe says 'N minutes after the water boils'. That instruction is incomplete. This one computes the time from the physics — and tells you where the model is weak.">
<meta property="og:url" content="https://actualeggtimer.netlify.app/">
<meta property="og:image" content="https://actualeggtimer.netlify.app/assets/social.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="1200">
<meta property="og:image:alt" content="A cutaway egg drawn as a contour map, hottest at the shell and coolest at the yolk.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Actual Egg Timer">
<meta name="twitter:description" content="A boiled-egg timer that computes the time from heat conduction and denaturation kinetics, not from a recipe.">
<meta name="twitter:image" content="https://actualeggtimer.netlify.app/assets/social.jpg">
</head>
<body data-phase="IDLE" data-start="cold">

<!-- The words are not in this file. Each element that shows one names its key
     in copy/<locale>.json with data-copy, and src/ui/copy.ts fills it in at
     boot, so the page and the iOS app read the same catalogue. The <head> is
     the exception: crawlers and link previews do not run scripts. -->
<main>

  <!-- ------------------------------------------------------------ readout -->
  <section id="readout">
    <p id="phaseLabel" data-copy="readout.phase.total"></p>

    <div id="bigtime" role="timer" aria-live="polite">
      <span id="digits" aria-hidden="true">--:--</span>
      <span class="sr-only" id="announce"></span>
    </div>

    <p id="subline"></p>

    <dl id="stats">
      <div><dt id="statYolkLabel" data-copy="readout.stat.peakYolk"></dt><dd id="statYolk">--</dd></div>
      <div id="afterBoilStat"><dt data-copy="readout.stat.afterBoiling"></dt><dd id="statAfter">--</dd></div>
      <div><dt data-copy="readout.stat.waterBoilsAt"></dt><dd id="statBoil">--</dd></div>
    </dl>

    <p id="note"></p>
    <p id="warn" hidden></p>
    <button type="button" id="mute" class="mute" aria-pressed="false" data-copy="readout.mute.on"></button>
  </section>

  <!-- ----------------------------------------------------------- controls -->
  <!-- Numeric bounds, steps, units and the preset temperatures are filled in
       at boot from src/core/policy.ts and src/core/units.ts, in the cook's
       units, so the markup cannot disagree with the model. -->
  <form id="controls" autocomplete="off">

    <div class="field field--slider">
      <label for="doneness" id="donenessLabel" data-copy="controls.doneness"></label>
      <div class="slider">
        <div class="slider__track" aria-hidden="true">
          <div class="slider__blocked" id="donenessBlockedSoft"></div>
          <div class="slider__blocked slider__blocked--hard" id="donenessBlockedHard"></div>
        </div>
        <input type="range" id="doneness" value="0.41" aria-describedby="donenessValue">
        <div class="slider__ticks" id="donenessTicks" aria-hidden="true"></div>
      </div>
      <p class="value" id="donenessValue"></p>
    </div>

    <div class="field">
      <label for="size" data-copy="controls.size"></label>
      <select id="size"></select>
    </div>

    <div class="field field--measure">
      <p class="measure__legend" id="measureLegend" data-copy="controls.measure.legend"></p>
      <div class="measure" role="group" aria-labelledby="measureLegend">
        <div>
          <label for="measureMass" data-copy="controls.measure.weight"></label>
          <span class="unit"><input type="number" id="measureMass" inputmode="decimal"><span id="unitMass"></span></span>
        </div>
        <div>
          <label for="measureGirth" data-copy="controls.measure.girth"></label>
          <span class="unit"><input type="number" id="measureGirth" inputmode="decimal"><span id="unitGirth"></span></span>
        </div>
        <div>
          <label for="measureMinor" data-copy="controls.measure.minor"></label>
          <span class="unit"><input type="number" id="measureMinor" inputmode="decimal"><span id="unitMinor"></span></span>
        </div>
      </div>
      <p class="hint" data-copy="controls.measure.hint"></p>
    </div>

    <fieldset class="field pan-only">
      <legend data-copy="controls.eggFrom"></legend>
      <div class="seg">
        <input type="radio" name="startTemp" id="tempFridge" value="fridge">
        <label for="tempFridge" data-copy="controls.eggFrom.fridge"></label>
        <input type="radio" name="startTemp" id="tempRoom" value="room">
        <label for="tempRoom" data-copy="controls.eggFrom.room"></label>
        <input type="radio" name="startTemp" id="tempCustom" value="custom">
        <label for="tempCustom" data-copy="controls.eggFrom.custom"></label>
      </div>
      <p class="hint" id="startTempHint"></p>
    </fieldset>

    <div class="field pan-only" id="customTempField" hidden>
      <label for="customTemp" data-copy="controls.eggTemp"></label>
      <span class="unit"><input type="number" id="customTemp" inputmode="decimal"><span id="unitTemp"></span></span>
    </div>

    <fieldset class="field">
      <legend data-copy="controls.start"></legend>
      <div class="seg">
        <input type="radio" name="startMode" id="startCold" value="cold">
        <label for="startCold" data-copy="controls.start.coldPan"></label>
        <input type="radio" name="startMode" id="startHot" value="hot">
        <label for="startHot" data-copy="controls.start.hot"></label>
        <input type="radio" name="startMode" id="startSous" value="sous">
        <label for="startSous" id="startSousLabel"></label>
      </div>
      <p class="hint" id="startHint" data-copy="controls.start.hint"></p>
    </fieldset>

    <fieldset class="field pan-only" id="afterBoilField">
      <legend data-copy="controls.atTheBoil"></legend>
      <div class="seg">
        <input type="radio" name="afterBoil" id="heatHold" value="hold">
        <label for="heatHold" data-copy="controls.afterBoil.keepItBoiling"></label>
        <input type="radio" name="afterBoil" id="heatOff" value="off">
        <label for="heatOff" data-copy="controls.afterBoil.heatOff"></label>
      </div>
      <p class="hint" data-copy="controls.afterBoil.hint"></p>
    </fieldset>

    <fieldset class="field pan-only">
      <legend data-copy="controls.then"></legend>
      <div class="seg">
        <input type="radio" name="cooling" id="coolIce" value="ice">
        <label for="coolIce" data-copy="controls.then.ice"></label>
        <input type="radio" name="cooling" id="coolTap" value="tap">
        <label for="coolTap" data-copy="controls.then.tap"></label>
        <input type="radio" name="cooling" id="coolCounter" value="counter">
        <label for="coolCounter" data-copy="controls.then.counter"></label>
      </div>
    </fieldset>

    <div class="field field--pair pan-only">
      <div>
        <label for="litres" data-copy="controls.water"></label>
        <span class="unit"><input type="number" id="litres" inputmode="decimal"><span id="unitLitres"></span></span>
      </div>
      <div>
        <label for="eggCount" data-copy="controls.eggs"></label>
        <span class="unit"><input type="number" id="eggCount" step="1" inputmode="numeric"><span></span></span>
      </div>
    </div>

    <div class="field pan-only">
      <label for="altitude" data-copy="controls.altitude"></label>
      <span class="unit"><input type="number" id="altitude" inputmode="numeric"><span id="unitAltitude"></span></span>
    </div>

    <!-- Not pan-only: a bath has a temperature too. Its default comes from the
         browser's region; a choice made here is stored as the cook's. -->
    <fieldset class="field" id="unitsField">
      <legend data-copy="controls.units"></legend>
      <div class="seg">
        <input type="radio" name="units" id="unitsMetric" value="metric">
        <label for="unitsMetric" data-copy="controls.units.metric"></label>
        <input type="radio" name="units" id="unitsImperial" value="imperial">
        <label for="unitsImperial" data-copy="controls.units.imperial"></label>
      </div>
    </fieldset>

  </form>

  <!-- What the app has learned from this kitchen, and the way to take it back. -->
  <div id="learned">
    <p class="hint" id="learnedNote"></p>
    <button type="button" id="forget" class="secondary" hidden data-copy="learned.forget"></button>
  </div>

  <!-- ------------------------------------------------------------ actions -->
  <div id="actions">
    <p id="primaryHint"></p>
    <button type="button" id="primary" class="primary" data-copy="action.startHeating"></button>
    <button type="button" id="secondary" class="secondary" hidden data-copy="action.cancel"></button>
    <!-- Two questions, always both, neither required (INFERENCE.md section 3).
         Each answer is folded the moment it is tapped; one left unanswered is
         recorded as skipped when the next cook starts. -->
    <div id="feedback" hidden>
      <p id="feedbackAsk" data-copy="feedback.ask"></p>
      <div class="seg">
        <button type="button" class="fb" data-fb="-1" data-copy="feedback.tooSoft"></button>
        <button type="button" class="fb" data-fb="0" data-copy="feedback.justRight"></button>
        <button type="button" class="fb" data-fb="1" data-copy="feedback.tooFirm"></button>
      </div>
      <p id="whiteAsk" data-copy="feedback.white.ask"></p>
      <div class="seg">
        <button type="button" class="wb" data-white="runny" data-copy="feedback.white.runny"></button>
        <button type="button" class="wb" data-white="tender" data-copy="feedback.white.tender"></button>
        <button type="button" class="wb" data-white="firm" data-copy="feedback.white.firm"></button>
      </div>
      <p class="hint" id="feedbackOptional" data-copy="feedback.optional"></p>
      <p class="hint" id="calibNote"></p>
    </div>
  </div>

  <!-- --------------------------------------------------------- colophon -->
  <footer id="colophon">
    <p><strong data-copy="colophon.name"></strong> <span data-copy="colophon.lede"></span>
      <a href="https://github.com/danmackinlay/actual_egg_timer"
      target="_blank" rel="noopener noreferrer" data-copy="colophon.link"></a>
      <span data-copy="colophon.tail"></span></p>
  </footer>

</main>

<script type="module" src="dist/src/ui/main.js"></script>
</body>
</html>
