<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0c0d0f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
<title>Actual Egg Timer</title>
<meta name="description" content="A boiled-egg timer that works out the time from how heat gets into your egg, counts the cooling, and learns how you like your yolk.">
<link rel="stylesheet" href="styles.css">
<!-- Every word on the page is in copy/en.json; the page waits for it. -->
<link rel="preload" href="copy/en.json" as="fetch" crossorigin="anonymous">

<link rel="canonical" href="https://actualeggtimer.netlify.app/">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Actual Egg Timer">

<!-- Absolute URLs: most scrapers will not resolve a relative one. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Actual Egg Timer">
<meta property="og:title" content="Actual Egg Timer">
<meta property="og:description" content="Recipes say 'N minutes after the water boils'. This works the time out from your egg, your water and how you cool it, and says how sure it is.">
<meta property="og:url" content="https://actualeggtimer.netlify.app/">
<meta property="og:image" content="https://actualeggtimer.netlify.app/assets/social.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="1200">
<meta property="og:image:alt" content="A cutaway egg drawn as a contour map, hottest at the shell and coolest at the yolk.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Actual Egg Timer">
<meta name="twitter:description" content="A boiled-egg timer that works out the time from how heat gets into your egg, counts the cooling, and learns how you like your yolk.">
<meta name="twitter:image" content="https://actualeggtimer.netlify.app/assets/social.jpg">
</head>
<body data-phase="IDLE" data-start="cold" data-view="egg">

<!-- The words are not in this file. Each element that shows one names its key
     in copy/<locale>.json with data-copy, and src/ui/copy.ts fills it in at
     boot, so the page and the iOS app read the same catalogue. The <head> is
     the exception: crawlers and link previews do not run scripts.

     Three views, one page (UI.md): the egg, Settings and Help. The hash
     picks one (#settings, #help, #help-<section>), so the phone's back button
     works; src/ui/views.ts sets data-view from it (#kitchen, the old
     address, still opens Settings). While a cook is running only
     the egg is shown, whatever the hash says.

     Every (i) is a button.info with aria-controls naming the paragraph it
     opens, which sits right after the line the (i) is on. data-label names
     the key of the control's own label, for "About {label}"; data-name, where
     a label will not read inside that, the key of the whole name. -->
<main>

  <!-- ------------------------------------------------------------ top bar -->
  <!-- The ways out to the other views, and sound, which works in every
       phase. Settings and Help are rare visits, so they sit at the top, out of
       the thumb's way; Start is at the bottom, in it. -->
  <header id="topbar">
    <button type="button" id="navBack" class="navlink navlink--back" data-copy="nav.back"></button>
    <a href="#settings" id="settingsLink" class="navlink" data-copy="controls.settings"></a>
    <a href="#help" id="helpLink" class="navlink" data-copy="help.link"></a>
    <button type="button" id="mute" class="mute" aria-pressed="false" data-copy="readout.mute.on"></button>
  </header>

  <!-- The title page, after the Dictionary's, heading the egg's page in
       the English of 1750 only (styles.css). Its long s is drawn, and the
       aria-label that applyCopy gives it reads without. -->
  <h1 class="titlepage" data-copy="app.titlePage"></h1>

  <!-- ------------------------------------------------------------ readout -->
  <section id="readout">
    <p id="phaseLabel" data-copy="readout.phase.total"></p>

    <div id="bigtime" role="timer" aria-live="polite">
      <span id="digits" aria-hidden="true">--:--</span>
      <span class="sr-only" id="announce"></span>
    </div>

    <p id="subline"><span id="sublineText"></span><button type="button" id="sublineInfo" class="info" aria-expanded="false" aria-controls="sublineMore" data-name="readout.sub.coldAssumes.info" hidden></button></p>
    <p id="sublineMore" class="disclosed" hidden data-copy="readout.sub.coldAssumes.more"></p>
    <!-- Which way the egg is likely to miss (src/ui/outcome.ts), with one
         (i) at its end: what the bracket under the slider means and how to
         play safe with it, why it starts wide, and what I learn from.
         Then a line when a runny white is a real risk. Filled once the
         choice is made; the direction keeps its line's height until then, so
         nothing jumps when it lands. -->
    <p id="direction"><span id="directionText"></span><button type="button" id="oddsInfo" class="info" aria-expanded="false" aria-controls="oddsWhy" data-name="outcome.info" hidden></button></p>
    <div id="oddsWhy" class="disclosed" hidden><p data-copy="outcome.bracket"></p><p data-copy="outcome.why"></p><p data-copy="outcome.learning"></p></div>
    <p id="whiteRisk" data-copy="outcome.whiteRunny" hidden></p>
  </section>

  <!-- While a cook runs, the cook in the pan (src/ui/app.ts,
       renderCookSetup): the setup sentence it was started with, as plain
       prose with nothing to tap, and under it the doneness and the peak
       yolk. From the cook's ticket, not the controls, which are put away. -->
  <section id="cookSetup" hidden>
    <!-- Beside it, the egg in cross-section (src/ui/eggSection.ts): how set
         each layer is, or a tap away its temperature. A prototype, with no
         words yet, so hidden from a screen reader. -->
    <svg id="eggSection" class="egg-section" aria-hidden="true" focusable="false"></svg>
    <div class="cook-setup__words">
      <p id="cookSentence"></p>
      <p id="cookDoneness"></p>
    </div>
  </section>

  <!-- ----------------------------------------------------------- the egg -->
  <!-- Two controls and a sentence (UI.md section 3). Numeric bounds, steps,
       units and the preset temperatures are filled in at boot from
       src/core/policy.ts and src/core/units.ts, in the cook's units, so the
       markup cannot disagree with the model. -->
  <form id="controls" autocomplete="off">

    <div>
      <!-- The heading: the control's name, and at its end the peak yolk the
           level asks for (or, in sous-vide, the water's temperature). The
           slider's aria-valuetext says the doneness word with it, so the
           number is hidden here rather than read twice. -->
      <div class="slider__head">
        <label for="doneness" data-copy="controls.doneness"></label>
        <span id="donenessPeak" aria-hidden="true"></span>
      </div>
      <div class="slider">
        <div class="slider__track" aria-hidden="true">
          <!-- The odds at each level, relative to the best level's: the
               stronger the band, the more often it hits the mark. -->
          <div class="slider__odds" id="donenessOdds"></div>
          <!-- Levels the pan can deliver but the odds do not yet offer. -->
          <div class="slider__unlikely" id="donenessUnlikelySoft"></div>
          <div class="slider__unlikely" id="donenessUnlikelyHard"></div>
          <div class="slider__blocked" id="donenessBlockedSoft"></div>
          <div class="slider__blocked slider__blocked--hard" id="donenessBlockedHard"></div>
        </div>
        <!-- The likely range of the yolk (src/core/outcome.ts): its 10-90%
             delivered doneness on the slider's scale, with a mark at the
             middle, under the thumb and clear of the odds shading on the
             track above. Drawn for the eye; #donenessRange says it in words. -->
        <div class="slider__range" aria-hidden="true"><div class="slider__bracket" id="donenessBracket" hidden><div class="slider__median" id="donenessMedian"></div></div></div>
        <input type="range" id="doneness" value="0.41" aria-describedby="donenessRange">
        <div class="slider__ticks" id="donenessTicks" aria-hidden="true"></div>
      </div>
      <span class="sr-only" id="donenessRange"></span>
      <p class="value value--note" id="note"></p>
    </div>

    <!-- The setup sentence. Its clauses are buttons, built by the app from
         setup.* in the catalogue; each opens its choice below, in place. -->
    <div id="setup">
      <p id="sentence"></p>

      <div class="panel" id="panelEgg" role="group" aria-labelledby="lblEgg" hidden>
        <div class="panel__head">
          <span class="panel__title" id="lblEgg" data-copy="controls.egg"></span>
          <button type="button" class="info" aria-expanded="false" aria-controls="moreEgg" data-label="controls.egg"></button>
          <button type="button" class="panel__close" data-copy="setup.close"></button>
        </div>
        <p id="moreEgg" class="disclosed" hidden data-copy="controls.egg.more"></p>
        <div class="prow">
          <label for="size" data-copy="controls.size"></label>
          <select id="size"></select>
        </div>
        <p class="measure__legend" id="measureLegend" data-copy="controls.measure.legend"></p>
        <div class="measure" role="group" aria-labelledby="measureLegend">
          <div>
            <label for="measureMass" data-copy="controls.measure.weight"></label>
            <span class="unit"><input type="number" id="measureMass" inputmode="decimal"><span id="unitMass"></span></span>
          </div>
          <div>
            <label for="measureGirth" data-copy="controls.measure.girth"></label>
            <span class="unit"><input type="number" id="measureGirth" inputmode="decimal"><span id="unitGirth"></span></span>
          </div>
          <div>
            <label for="measureMinor" data-copy="controls.measure.minor"></label>
            <span class="unit"><input type="number" id="measureMinor" inputmode="decimal"><span id="unitMinor"></span></span>
          </div>
        </div>
        <p class="hint" data-copy="controls.measure.hint"></p>
      </div>

      <div class="panel pan-only" id="panelFrom" role="group" aria-labelledby="lblFrom" hidden>
        <div class="panel__head">
          <span class="panel__title" id="lblFrom" data-copy="controls.eggFrom"></span>
          <button type="button" class="info" aria-expanded="false" aria-controls="moreFrom" data-label="controls.eggFrom"></button>
          <button type="button" class="panel__close" data-copy="setup.close"></button>
        </div>
        <p id="moreFrom" class="disclosed" hidden data-copy="controls.eggFrom.more"></p>
        <div class="seg">
          <input type="radio" name="startTemp" id="tempFridge" value="fridge">
          <label for="tempFridge" data-copy="controls.eggFrom.fridge"></label>
          <input type="radio" name="startTemp" id="tempRoom" value="room">
          <label for="tempRoom" data-copy="controls.eggFrom.room"></label>
          <input type="radio" name="startTemp" id="tempCustom" value="custom">
          <label for="tempCustom" data-copy="controls.eggFrom.custom"></label>
        </div>
        <div class="prow" id="customTempField" hidden>
          <label for="customTemp" data-copy="controls.eggTemp"></label>
          <span class="unit"><input type="number" id="customTemp" inputmode="decimal"><span id="unitTemp"></span></span>
        </div>
        <p class="hint" id="startTempHint"></p>
      </div>

      <div class="panel" id="panelStart" role="group" aria-labelledby="lblStart" hidden>
        <div class="panel__head">
          <span class="panel__title" id="lblStart" data-copy="controls.start"></span>
          <button type="button" class="info" aria-expanded="false" aria-controls="moreStart" data-label="controls.start"></button>
          <button type="button" class="panel__close" data-copy="setup.close"></button>
        </div>
        <p id="moreStart" class="disclosed" hidden data-copy="controls.start.more"></p>
        <div class="seg">
          <input type="radio" name="startMode" id="startCold" value="cold">
          <label for="startCold" data-copy="controls.start.cold"></label>
          <input type="radio" name="startMode" id="startHot" value="hot">
          <label for="startHot" data-copy="controls.start.hot"></label>
          <input type="radio" name="startMode" id="startSous" value="sous">
          <label for="startSous" id="startSousLabel"></label>
        </div>
      </div>

      <div class="panel pan-only" id="panelCooling" role="group" aria-labelledby="lblCooling" hidden>
        <div class="panel__head">
          <span class="panel__title" id="lblCooling" data-copy="controls.cooling"></span>
          <button type="button" class="info" aria-expanded="false" aria-controls="moreCooling" data-label="controls.cooling"></button>
          <button type="button" class="panel__close" data-copy="setup.close"></button>
        </div>
        <p id="moreCooling" class="disclosed" hidden data-copy="controls.cooling.more"></p>
        <div class="seg">
          <input type="radio" name="cooling" id="coolIce" value="ice">
          <label for="coolIce" data-copy="controls.cooling.ice"></label>
          <input type="radio" name="cooling" id="coolTap" value="tap">
          <label for="coolTap" data-copy="controls.cooling.tap"></label>
          <input type="radio" name="cooling" id="coolCounter" value="counter">
          <label for="coolCounter" data-copy="controls.cooling.counter"></label>
        </div>
      </div>
    </div>
  </form>

  <!-- -------------------------------------------------------------- slot -->
  <!-- The one place for a longer line, in every phase: a refusal, a
       reloaded cook, the sous-vide warning, or a first-egg welcome; and
       under low odds, the way to Help. -->
  <div id="slot">
    <p id="warn" hidden></p>
    <p id="welcome" hidden data-copy="idle.welcome"></p>
    <p id="advice" hidden><a href="#help-reliable" class="morelink" data-copy="advice.toggle"></a></p>
  </div>

  <!-- ---------------------------------------------------------- settings -->
  <!-- Set once, cook many: what belongs to the kitchen rather than the egg. -->
  <section id="settings" class="page" aria-labelledby="settingsTitle">
    <h1 id="settingsTitle" tabindex="-1" data-copy="controls.settings"></h1>
    <form id="settingsForm" autocomplete="off">

      <!-- Not pan-only: a sous-vide egg has a temperature too. Its default
           comes from the browser's region; a choice made here is stored as
           the cook's. -->
      <fieldset class="setting" aria-labelledby="lblUnits">
        <div class="setting__head">
          <span id="lblUnits" data-copy="controls.units"></span>
          <button type="button" class="info" aria-expanded="false" aria-controls="moreUnits" data-label="controls.units"></button>
        </div>
        <p id="moreUnits" class="disclosed" hidden data-copy="controls.units.more"></p>
        <div class="seg">
          <input type="radio" name="units" id="unitsMetric" value="metric">
          <label for="unitsMetric" data-copy="controls.units.metric"></label>
          <input type="radio" name="units" id="unitsImperial" value="imperial">
          <label for="unitsImperial" data-copy="controls.units.imperial"></label>
        </div>
        <!-- The one line that finds the English of 1750 for a cook who
             starts in Imperial (LANGUAGE.md section 6). English UIs only. -->
        <p id="unitsPeriod" class="setting__sub" data-copy="controls.units.period"></p>
      </fieldset>

      <!-- English, or the English of 1750. Changing it never changes
           the units; switching the units to Imperial in modern English
           changes it (src/core/language.ts). -->
      <fieldset class="setting" aria-labelledby="lblLanguage">
        <div class="setting__head">
          <span id="lblLanguage" data-copy="controls.language"></span>
          <button type="button" class="info" aria-expanded="false" aria-controls="moreLanguage" data-label="controls.language"></button>
        </div>
        <p id="moreLanguage" class="disclosed" hidden data-copy="controls.language.more"></p>
        <div class="seg">
          <input type="radio" name="language" id="languageEn" value="en">
          <label for="languageEn" data-copy="language.en"></label>
          <input type="radio" name="language" id="language1750" value="en-x-1750">
          <label for="language1750" data-copy="language.en1750"></label>
        </div>
      </fieldset>

      <div class="setting pan-only">
        <div class="setting__line">
          <span class="setting__head">
            <label for="altitude" data-copy="controls.altitude"></label>
            <button type="button" class="info" aria-expanded="false" aria-controls="moreAltitude" data-label="controls.altitude"></button>
          </span>
          <span class="unit"><input type="number" id="altitude" inputmode="numeric"><span id="unitAltitude"></span></span>
        </div>
        <p id="moreAltitude" class="disclosed" hidden data-copy="controls.altitude.more"></p>
        <p class="setting__sub"><span data-copy="readout.stat.waterBoilsAt"></span> <strong id="statBoil">--</strong></p>
      </div>

      <div class="setting pan-only">
        <div class="setting__line">
          <span class="setting__head">
            <label for="litres" data-copy="controls.water"></label>
            <button type="button" class="info" aria-expanded="false" aria-controls="moreWater" data-label="controls.water"></button>
          </span>
          <span class="unit"><input type="number" id="litres" inputmode="decimal"><span id="unitLitres"></span></span>
        </div>
        <p id="moreWater" class="disclosed" hidden data-copy="controls.water.more"></p>
      </div>

      <div class="setting pan-only">
        <div class="setting__line">
          <span class="setting__head">
            <label for="eggCount" data-copy="controls.eggsInPan"></label>
            <button type="button" class="info" aria-expanded="false" aria-controls="moreEggs" data-label="controls.eggsInPan"></button>
          </span>
          <span class="unit"><input type="number" id="eggCount" step="1" inputmode="numeric"></span>
        </div>
        <p id="moreEggs" class="disclosed" hidden data-copy="controls.eggsInPan.more"></p>
      </div>

      <fieldset class="setting pan-only" aria-labelledby="lblAfterBoil">
        <div class="setting__head">
          <span id="lblAfterBoil" data-copy="controls.afterTheBoil"></span>
          <button type="button" class="info" aria-expanded="false" aria-controls="moreAfterBoil" data-label="controls.afterTheBoil"></button>
        </div>
        <p id="moreAfterBoil" class="disclosed" hidden data-copy="controls.afterTheBoil.more"></p>
        <div class="seg">
          <input type="radio" name="afterBoil" id="heatHold" value="hold">
          <label for="heatHold" data-copy="controls.afterTheBoil.keepBoiling"></label>
          <input type="radio" name="afterBoil" id="heatOff" value="off">
          <label for="heatOff" data-copy="controls.afterTheBoil.heatOff"></label>
        </div>
      </fieldset>

      <!-- The probe thermometer. Off by default; offered once during a cook, and changed here. -->
      <fieldset class="setting pan-only" aria-labelledby="lblProbe">
        <div class="setting__head">
          <span id="lblProbe" data-copy="controls.thermometer"></span>
          <button type="button" class="info" aria-expanded="false" aria-controls="moreProbe" data-label="controls.thermometer"></button>
        </div>
        <p id="moreProbe" class="disclosed" hidden data-copy="controls.thermometer.more"></p>
        <label class="check" for="probeSetting"><input type="checkbox" id="probeSetting"><span data-copy="controls.thermometer.ask"></span></label>
      </fieldset>
    </form>

    <!-- What the app has learned from this kitchen, and the way to take it
         back, confirmed first. -->
    <section id="learned" class="setting" aria-labelledby="lblLearned">
      <div class="setting__head">
        <span id="lblLearned" data-copy="learned.title"></span>
      </div>
      <p class="hint" id="learnedNote" tabindex="-1"></p>
      <div class="forget__row">
        <button type="button" id="forget" class="secondary" hidden data-copy="learned.forget"></button>
        <button type="button" id="forgetInfo" class="info" aria-expanded="false" aria-controls="moreForget" data-label="learned.forget" hidden></button>
      </div>
      <p id="moreForget" class="disclosed" hidden data-copy="learned.forget.more"></p>
      <div id="forgetConfirm" role="group" aria-labelledby="forgetTitle" aria-describedby="forgetMessage" hidden>
        <p id="forgetTitle" data-copy="learned.confirm.title"></p>
        <p id="forgetMessage" class="hint" data-copy="learned.confirm.message"></p>
        <div class="confirm__row">
          <button type="button" id="forgetYes" class="secondary danger" data-copy="learned.confirm.forget"></button>
          <button type="button" id="forgetNo" class="secondary" data-copy="learned.confirm.keep"></button>
        </div>
      </div>
    </section>

    <footer id="colophon">
      <p><strong data-copy="colophon.name"></strong> <span data-copy="colophon.lede"></span>
        <a href="https://github.com/danmackinlay/actual_egg_timer"
        target="_blank" rel="noopener noreferrer" data-copy="colophon.link"></a>
        <span data-copy="colophon.tail"></span></p>
    </footer>
  </section>

  <!-- -------------------------------------------------------------- help -->
  <!-- The second tier: the whole story, opened on purpose. One control's
       meaning is its (i); this is everything around it. -->
  <section id="help" class="page" aria-labelledby="helpTitle">
    <h1 id="helpTitle" tabindex="-1" data-copy="help.title"></h1>
    <nav class="toc">
      <a href="#help-how" data-copy="help.how.title"></a>
      <a href="#help-learn" data-copy="help.learn.title"></a>
      <a href="#help-reliable" data-copy="help.reliable.title"></a>
      <a href="#help-odds" data-copy="help.odds.title"></a>
      <a href="#help-unsure" data-copy="help.unsure.title"></a>
      <a href="#help-sources" data-copy="help.sources.title"></a>
    </nav>

    <section id="help-how" aria-labelledby="helpHowTitle">
      <h2 id="helpHowTitle" data-copy="help.how.title"></h2>
      <p data-copy="help.how.p1"></p>
      <p class="aside" data-copy="help.how.aside" data-copy-links></p>
      <p data-copy="help.how.p2"></p>
      <p class="aside" data-copy="help.how.aside2" data-copy-links></p>
    </section>

    <section id="help-learn" aria-labelledby="helpLearnTitle">
      <h2 id="helpLearnTitle" data-copy="help.learn.title"></h2>
      <p data-copy="help.learn.p1"></p>
      <p class="aside" data-copy="help.learn.aside" data-copy-links></p>
    </section>

    <section id="help-reliable" aria-labelledby="helpReliableTitle">
      <h2 id="helpReliableTitle" data-copy="help.reliable.title"></h2>
      <p data-copy="help.reliable.intro"></p>
      <!-- Under low odds: the changes that would help the setup on screen,
           from protocolAdvice in src/core/reach.ts. -->
      <div id="forYou" class="foryou" hidden>
        <h3 data-copy="help.reliable.forYou"></h3>
        <ul id="adviceList"></ul>
      </div>
      <h3 data-copy="help.reliable.every.title"></h3>
      <p data-copy="help.reliable.every"></p>
      <h3 data-copy="help.reliable.hot.title"></h3>
      <p data-copy="help.reliable.hot"></p>
      <h3 data-copy="help.reliable.cold.title"></h3>
      <p data-copy="help.reliable.cold"></p>
      <h3 data-copy="help.reliable.heatOff.title"></h3>
      <p data-copy="help.reliable.heatOff"></p>
      <h3 data-copy="help.reliable.cooling.title"></h3>
      <p data-copy="help.reliable.cooling"></p>
    </section>

    <section id="help-odds" aria-labelledby="helpOddsTitle">
      <h2 id="helpOddsTitle" data-copy="help.odds.title"></h2>
      <p data-copy="help.odds.p1"></p>
      <p class="aside" data-copy="help.odds.aside" data-copy-links></p>
    </section>

    <section id="help-unsure" aria-labelledby="helpUnsureTitle">
      <h2 id="helpUnsureTitle" data-copy="help.unsure.title"></h2>
      <p data-copy="help.unsure.counter"></p>
      <p data-copy="help.unsure.heatOff"></p>
      <p data-copy="help.unsure.white"></p>
      <p id="helpSousVide"></p>
    </section>

    <section id="help-sources" aria-labelledby="helpSourcesTitle">
      <h2 id="helpSourcesTitle" data-copy="help.sources.title"></h2>
      <p data-copy="help.sources.intro" data-copy-links></p>
      <!-- As README.md section 10 and references.bib give them; nothing else. -->
      <ul class="sources">
        <li><a href="https://newton.ex.ac.uk/teaching/CDHW/egg/" target="_blank" rel="noopener noreferrer" data-copy="help.source.williams"></a></li>
        <li><a href="https://doi.org/10.1088/0143-0807/27/1/013" target="_blank" rel="noopener noreferrer" data-copy="help.source.buay"></a></li>
        <li><a href="https://doi.org/10.1002/fsn3.257" target="_blank" rel="noopener noreferrer" data-copy="help.source.abbasnezhad"></a></li>
        <li><a href="https://doi.org/10.1016/j.jfoodeng.2003.06.002" target="_blank" rel="noopener noreferrer" data-copy="help.source.denys"></a></li>
        <li><a href="https://doi.org/10.1007/s11483-010-9200-1" target="_blank" rel="noopener noreferrer" data-copy="help.source.vega"></a></li>
        <li><a href="https://doi.org/10.1110/ps.03242803" target="_blank" rel="noopener noreferrer" data-copy="help.source.weijers"></a></li>
        <li><a href="https://academic.oup.com/auk/article-pdf/96/1/73/32910692/auk0073.pdf" target="_blank" rel="noopener noreferrer" data-copy="help.source.hoyt"></a></li>
        <li><a href="https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/high-altitude-cooking" target="_blank" rel="noopener noreferrer" data-copy="help.source.usda"></a></li>
      </ul>
    </section>

    <!-- The privacy page: a page of its own on this site, plain English and
         outside the catalogue (privacy/index.html). Its back link returns. -->
    <p class="privacylink"><a href="/privacy" class="morelink" data-copy="help.privacy"></a></p>
  </section>

  <!-- ------------------------------------------------------------ actions -->
  <div id="actions">
    <p id="primaryHint"><span id="primaryHintText"></span><button type="button" id="hintInfo" class="info" aria-expanded="false" aria-controls="hintMore" data-name="action.hint.heating.info" hidden></button></p>
    <p id="hintMore" class="disclosed" hidden data-copy="action.hint.heating.more"></p>
    <button type="button" id="primary" class="primary" data-copy="action.startHeating"></button>
    <button type="button" id="secondary" class="secondary" hidden data-copy="action.cancel"></button>
    <!-- The thermometer, offered once, after "Eggs in". -->
    <div id="probeOffer" hidden>
      <p class="hint" data-copy="probe.offer"></p>
      <div class="pair">
        <button type="button" class="secondary" id="probeOfferYes" data-copy="probe.offer.yes"></button>
        <button type="button" class="secondary" id="probeOfferNo" data-copy="probe.offer.no"></button>
      </div>
    </div>
    <!-- Two questions, always both, neither required (INFERENCE.md section 3).
         Each answer is folded the moment it is tapped; one left unanswered is
         recorded as skipped when the next cook starts. -->
    <div id="feedback" hidden>
      <!-- A reading at the middle, when the cooling ends. -->
      <div id="probeEntry" hidden>
        <p id="probeNow" data-copy="probe.now"></p>
        <p class="hint" id="probeHint" data-copy="probe.hint"></p>
        <div class="probe__row">
          <label class="sr-only" for="probeReading" data-copy="probe.entry"></label>
          <span class="unit"><input type="number" id="probeReading" inputmode="decimal"><span id="unitProbe"></span></span>
          <button type="button" class="secondary" id="probeSave" data-copy="probe.save"></button>
        </div>
        <p class="hint" id="probeNote" aria-live="polite"></p>
      </div>
      <p id="feedbackAsk" data-copy="feedback.ask"></p>
      <div class="pair">
        <button type="button" class="fb" data-fb="-1" data-copy="feedback.tooSoft"></button>
        <button type="button" class="fb" data-fb="0" data-copy="feedback.justRight"></button>
        <button type="button" class="fb" data-fb="1" data-copy="feedback.tooFirm"></button>
      </div>
      <p id="whiteAsk" data-copy="feedback.white.ask"></p>
      <div class="pair">
        <button type="button" class="wb" data-white="runny" data-copy="feedback.white.runny"></button>
        <button type="button" class="wb" data-white="tender" data-copy="feedback.white.tender"></button>
        <button type="button" class="wb" data-white="firm" data-copy="feedback.white.firm"></button>
      </div>
      <p class="hint" id="feedbackOptional" data-copy="feedback.optional"></p>
      <p class="hint" id="calibNote"></p>
    </div>
  </div>

</main>

<script type="module" src="dist/src/ui/main.js"></script>
</body>
</html>
