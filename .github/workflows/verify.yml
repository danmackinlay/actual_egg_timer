# The gate, on every push of a branch. Separate jobs, so that each runs on
# the runner it needs and all run side by side: web and the web e2e on Linux,
# quick to start, the e2e in shards; apple and ios-e2e on macOS, for
# Swift and the iOS app; fit on Linux under uv, with no node, off for now.
# x86 Linux differs from arm64 macOS in the last bit of some numbers, so the
# fixture check holds them to Swift's tolerance (tools/fixtureCompare.ts).
# The actions are @v5, on Node 24.
#
# A push that changes only documents runs nothing (paths-ignore). Otherwise
# web always runs; the macOS jobs only when the branch changed something
# they build, and the web e2e only when it changed something the web serves
# or tests (changes, below); a push to main runs them all. A tag's push
# always runs, since GitHub does not apply path filters to tags. ios-e2e
# runs only on main and on demand (`gh workflow run verify --ref <branch>`),
# when it is the only job that runs.
#
# A pull request runs it only from a fork: a branch of this repository has
# had its run, on the same commit, when it was pushed. A release tag is
# pushed with main (`--follow-tags`), on main's commit, so main's run is the
# tag's; the tag's own run checks only that it names package.json's version
# and that its commit is on main.
name: verify

on:
  push:
    paths-ignore: ['**.md', '.claude/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', '.claude/**', 'LICENSE']
  workflow_dispatch:

# One run at a time for each branch: a newer push to a branch cancels the
# run of the older one. On main a run in progress finishes and the newer
# waits for it; but GitHub keeps one waiting run a group, so a third push
# before the first run ends cancels the waiting one, whose commit then has
# no run of its own.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which of the slow jobs this push needs. On a branch, every file the
  # branch changed since it left main, not only this push's, so that a run
  # cancelled by a newer push is never what decided; on main, all of them.
  changes:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apple: ${{ github.ref == 'refs/heads/main' || steps.filter.outputs.apple == 'true' }}
      web: ${{ github.ref == 'refs/heads/main' || steps.filter.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            apple:
              - 'ios/**'
              - 'src/core/**'
              - 'fixtures/**'
              - 'copy/**'
              - 'tools/ios*.ts'
              - 'tools/swiftConstants.ts'
              - 'tools/copyKeys.ts'
              - 'package*.json'
              - '.node-version'
              - '.github/workflows/verify.yml'
            web:
              - 'src/**'
              - 'index.html'
              - 'styles.css'
              - 'site.webmanifest'
              - 'assets/**'
              - 'fixtures/population.json'
              - 'copy/**'
              - 'tools/e2e*'
              - 'tools/e2e/**'
              - 'tools/harness.ts'
              - 'tools/chrome.ts'
              - 'tools/buildSite.ts'
              - 'tools/precache.ts'
              - 'package*.json'
              - '.node-version'
              - '.github/workflows/verify.yml'

  tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # A release tag names the version it releases: v<package.json version>.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  web:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      # The generated files against the commit, before npm test rewrites
      # the key types and the Swift's constants.
      - run: npm run copy:keys -- --check
      - run: npm run swift:constants -- --check
      - run: npm run fixtures:check
      - run: npm test
      # Nothing above changed a committed file.
      - run: git diff --exit-code

  # The Swift package's tests, and the app built for Release with no literal
  # in SwiftUI's text calls (tools/iosBuild.ts). Its Debug build, the other
  # half of `npm run ios:build`, is ios-e2e's.
  apple:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: cd ios/EggTimerCore && swift test
      - run: brew install xcodegen
      - run: npm run ios:build -- --release

  # Builds the app and its UI tests for Debug and drives it on a simulator,
  # every scenario in one xcodebuild, beside apple rather than after it: an
  # artifact between jobs is a zip, which drops the bundle's file modes, so
  # it builds its own either way. Only on main and on demand: what only a
  # device shows.
  ios-e2e:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    # Ample: the build is included, a hosted macOS runner is slow, and a new
    # simulator's first launches slower still.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: brew install xcodegen
      # What the runner offers, for the log: the script takes the newest
      # iOS runtime and an iPhone it runs.
      - run: xcodebuild -version && xcrun simctl list runtimes
      - run: npm run ios:e2e
        env:
          # A wait for the app gives up after this many seconds; a slow
          # runner's first launches take tens.
          AET_E2E_WAIT: "180"
          # A failing scenario's debug log, in the job's log.
          AET_E2E_LOG: "1"
      # A failing run's result bundle (each test's steps and the screen at a
      # failure) and the app's debug logs, to download from the run's page.
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ios-e2e
          path: |
            ios/build/e2e/results
            ios/build/e2e/runs
          retention-days: 7

  fit:
    # Off until shared eggs arrive to fit (PLAN.md, next work 1).
    if: false
    runs-on: ubuntu-latest
    # Its likelihood held to the core's, and NUTS recovering a known
    # population, from the samples `npm run fixtures -- fit` writes into
    # fit/tests/. The recovery check's four chains run side by side on the
    # runner's four cores.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv run --project fit pytest -q fit/tests

  # The web e2e in shards, a job each (tools/e2e/shards.ts), since this
  # 2-core runner takes one scenario at a time; the count is the matrix's
  # alone. Every shard runs to its end, and any that fails fails the run.
  e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: e2e ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: google-chrome --version
      - run: npm run build:site
      # A scenario that fails prints the page's text.
      - run: node tools/e2e.ts --shard ${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          E2E_DEBUG: '1'
