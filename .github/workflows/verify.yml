# The gate, on every push and pull request, as three jobs that run side by
# side, and a fourth after the second. `npm run verify` locally is the first
# two but the iOS build.
#
# web, on Linux (quick to start): the type checks, the tests and the Swift
# copy lint.
#
# apple, on macOS: fixtures that match a fresh `npm run fixtures`, the Swift
# core against them (`swift test`, against the Foundation the apps are built
# with), then `npm run ios:build`, the app and its widget built for the
# simulator, unsigned, which `swift test` does not reach. The fixtures are
# checked here, not on Linux: they pin numbers to the last bit, and the same
# TypeScript on x86 Linux differs from arm64 macOS, where they are made, in
# the last digit of some (seen 4 October 2026).
#
# ios-e2e, on macOS, once apple has passed: `npm run ios:e2e`, the app driven
# through its 16 scenarios on a simulator of the script's own, its clock
# frozen at each moment checked and stepped between them, so a slow runner
# takes longer and checks the same (tools/iosE2e.mjs; ios/README.md). It
# builds the Debug app again rather than taking apple's: an artifact
# between jobs is a zip, which drops the bundle's file modes, and apple's
# build is to another derived-data path. New on GitHub's runners and not
# yet run there, so it may fail without failing the run (continue-on-error)
# until it has passed there; then that line goes.
#
# fit, on Linux: the population fit's tests (`fit/`, Python under uv),
# since the fit writes `fixtures/population.json`, which both apps ship.
# Its tests read only files committed under `fit/tests`.
#
# The actions are @v5 (setup-uv @v10), which run on Node 24; @v4 ran on Node 20, which GitHub
# retires. The Node the project itself runs is `.node-version`.
name: verify

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      # A release tag names the version it releases: v<package.json version>.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm run check
      - run: npm test
      - run: npm run copy:literals

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm run fixtures:check
      - run: cd ios/EggTimerCore && swift test
      - run: brew install xcodegen
      - run: npm run ios:build

  ios-e2e:
    needs: apple
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: brew install xcodegen
      # What the runner offers, for the log: the script takes the newest
      # iOS runtime and an iPhone it runs.
      - run: xcodebuild -version && xcrun simctl list runtimes
      - run: npm run ios:e2e
        env:
          # A wait for the app gives up after this many seconds; a slow
          # runner's first launches take tens.
          AET_E2E_WAIT: "180"
          # A failing scenario's debug log, in the job's log.
          AET_E2E_LOG: "1"

  fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10
      - run: uv run --project fit pytest -q fit/tests
