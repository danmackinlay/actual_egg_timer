# The gate, on every push and pull request. Separate jobs, so that each runs
# on the runner it needs and all run side by side: web and e2e on Linux, quick
# to start; apple on macOS, for Swift and the iOS build; fit on Linux under uv,
# with no node: its likelihood held to the core's, and NUTS recovering a known
# population, from fixtures npm run fixtures wrote into fit/tests/. ios-e2e
# waits for apple and builds its own app: an artifact between jobs is a zip,
# which drops the bundle's file modes. x86 Linux differs from arm64 macOS in
# the last bit of some numbers, so the fixture check holds them to Swift's
# tolerance (tools/fixtureCompare.ts). The actions are @v5, on Node 24.
name: verify

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      # A release tag names the version it releases: v<package.json version>.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm test
      # The tests again, sweeping every point where npm test sweeps fewer.
      - run: npm run test:slow
      - run: npm run validate
      - run: npm run copy:literals
      - run: npm run copy:keys -- --check
      - run: npm run fixtures:check

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: cd ios/EggTimerCore && swift test
      - run: brew install xcodegen
      - run: npm run ios:build

  ios-e2e:
    needs: apple
    runs-on: macos-latest
    # About ten minutes on a developer's Mac, the build included; a hosted
    # runner is slower, and a new simulator's first launches slower still.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: brew install xcodegen
      # What the runner offers, for the log: the script takes the newest
      # iOS runtime and an iPhone it runs.
      - run: xcodebuild -version && xcrun simctl list runtimes
      - run: npm run ios:e2e
        env:
          # A wait for the app gives up after this many seconds; a slow
          # runner's first launches take tens.
          AET_E2E_WAIT: "180"
          # A failing scenario's debug log, in the job's log.
          AET_E2E_LOG: "1"

  fit:
    runs-on: ubuntu-latest
    # The recovery check's four chains run side by side on the runner's four
    # cores: about a minute and a quarter on a developer's Mac.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv run --project fit pytest -q fit/tests

  e2e:
    runs-on: ubuntu-latest
    # About eight minutes on a developer's Mac; room for a slower runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: google-chrome --version
      # A scenario that fails prints the page's text.
      - run: npm run e2e
        env:
          E2E_DEBUG: '1'
