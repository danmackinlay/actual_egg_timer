# The gate, on every push of a branch. Separate jobs, so that each runs on
# the runner it needs and all run side by side: web and e2e on Linux,
# quick to start, the e2e in four shards; apple on macOS, for Swift and the
# iOS build; fit on Linux under uv, since the fit writes
# fixtures/population.json, which both apps ship. ios-e2e waits for apple and
# builds its own app: an artifact between jobs is a zip, which drops the
# bundle's file modes. x86 Linux differs from arm64 macOS in the last bit of
# some numbers, so the fixture check holds them to Swift's tolerance
# (tools/fixtureCompare.ts). The actions are @v5, on Node 24.
#
# A pull request runs it only from a fork: a branch of this repository has
# had its run, on the same commit, when it was pushed. A release tag is
# pushed with main (`--follow-tags`), on main's commit, so main's run is the
# tag's; the tag's own run checks only that it names package.json's version
# and that its commit is on main.
name: verify

on:
  push:
  pull_request:

# One run at a time for each branch: a newer push to a branch cancels the
# run of the older one, but on main, whose runs finish, the newer waits.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # A release tag names the version it releases: v<package.json version>.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  web:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm test
      # The tests again, sweeping every point where npm test sweeps fewer.
      - run: npm run test:slow
      - run: npm run validate
      - run: npm run copy:literals
      - run: npm run copy:keys -- --check
      - run: npm run fixtures:check

  apple:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || github.event.pull_request.head.repo.fork) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: cd ios/EggTimerCore && swift test
      - run: brew install xcodegen
      - run: npm run ios:build

  ios-e2e:
    needs: apple
    runs-on: macos-latest
    # About ten minutes on a developer's Mac, the build included; a hosted
    # runner is slower, and a new simulator's first launches slower still.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: brew install xcodegen
      # What the runner offers, for the log: the script takes the newest
      # iOS runtime and an iPhone it runs.
      - run: xcodebuild -version && xcrun simctl list runtimes
      - run: npm run ios:e2e
        env:
          # A wait for the app gives up after this many seconds; a slow
          # runner's first launches take tens.
          AET_E2E_WAIT: "180"
          # A failing scenario's debug log, in the job's log.
          AET_E2E_LOG: "1"

  fit:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv run --project fit pytest -q fit/tests

  # The web e2e in four shards, a job each (tools/e2e/shards.ts): the whole
  # takes about 23 minutes on this 2-core runner, one scenario at a time
  # (seven on a developer's Mac), and a shard about six. Every shard runs to
  # its end, and any that fails fails the run.
  e2e:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: e2e ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: google-chrome --version
      - run: npm run build:site
      # A scenario that fails prints the page's text.
      - run: node tools/e2e.ts --shard ${{ matrix.shard }}/4
        env:
          E2E_DEBUG: '1'
