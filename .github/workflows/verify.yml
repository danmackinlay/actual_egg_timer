# The gate, on every push and pull request, as four jobs that run side by
# side, and a fifth after the second. `npm run verify` locally is the first
# two but the iOS build.
#
# web, on Linux (quick to start): the type checks, the tests, the
# validation table (`npm run validate`), the Swift copy lint, and fixtures
# that match a fresh `npm run fixtures`. The same TypeScript on x86 Linux
# differs from arm64 macOS, where the fixtures are made, in the last bits of
# some numbers, so the check holds every number to 1e-13 of its value
# rather than to the byte (tools/fixtureCompare.ts).
#
# apple, on macOS: the Swift core against the committed fixtures (`swift
# test`, against the Foundation the apps are built with), then `npm run
# ios:build`, the app and its widget built for the simulator, unsigned,
# which `swift test` does not reach.
#
# ios-e2e, on macOS, once apple has passed: `npm run ios:e2e`, the app driven
# through its scenarios on a simulator of the script's own, its clock
# frozen at each moment checked and stepped between them, so a slow runner
# takes longer and checks the same (tools/iosE2e.ts; ios/README.md). It
# builds the Debug app again rather than taking apple's: an artifact
# between jobs is a zip, which drops the bundle's file modes, and apple's
# build is to another derived-data path. A failing scenario fails the run.
#
# fit, on Linux: the population fit's tests (`fit/`, Python under uv),
# since the fit writes `fixtures/population.json`, which both apps ship.
# Its tests read only files committed under `fit/tests`.
#
# e2e, on Linux: `npm run e2e`, the web app driven end to end in headless
# Chrome (the image's google-chrome, which tools/chrome.ts finds; run
# without its sandbox under CI). Every scenario steps a stopped development
# clock to the moments it checks, so a slow runner sees what a fast one does
# (README §9, "Checking the web app end to end"). A failing scenario, or a
# copy state with a raw key, a straight quote or the certainty line where
# the state says it should not be, fails the run.
#
# The actions are @v5 (setup-uv @v10), which run on Node 24; @v4 ran on Node 20, which GitHub
# retires. The Node the project itself runs is `.node-version`.
name: verify

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      # A release tag names the version it releases: v<package.json version>.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm run build
      - run: npm test
      - run: npm run validate
      - run: npm run copy:literals
      - run: npm run fixtures:check

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: cd ios/EggTimerCore && swift test
      - run: brew install xcodegen
      - run: npm run ios:build

  ios-e2e:
    needs: apple
    runs-on: macos-latest
    # About ten minutes on a developer's Mac, the build included; a hosted
    # runner is slower, and a new simulator's first launches slower still.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: brew install xcodegen
      # What the runner offers, for the log: the script takes the newest
      # iOS runtime and an iPhone it runs.
      - run: xcodebuild -version && xcrun simctl list runtimes
      - run: npm run ios:e2e
        env:
          # A wait for the app gives up after this many seconds; a slow
          # runner's first launches take tens.
          AET_E2E_WAIT: "180"
          # A failing scenario's debug log, in the job's log.
          AET_E2E_LOG: "1"

  fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10
      - run: uv run --project fit pytest -q fit/tests

  e2e:
    runs-on: ubuntu-latest
    # About eight minutes on a developer's Mac; room for a slower runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: google-chrome --version
      # A scenario that fails prints the page's text.
      - run: npm run e2e
        env:
          E2E_DEBUG: '1'
