# The Xcode project is GENERATED, not committed as a pbxproj.
#
#   cd ios && xcodegen
#
# A pbxproj is three thousand lines of machine-written XML that every branch
# conflicts on and nobody can review. This file is the source of truth, it fits
# on a screen, and `xcodegen` rebuilds the project from it in a second.
# ActualEggTimer.xcodeproj is therefore gitignored: generate it, do not hunt for
# it in the history.
name: ActualEggTimer
options:
  bundleIdPrefix: name.danmackinlay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: none

packages:
  EggTimerCore:
    # The physics, already conformant against the TypeScript. See ios/README.md.
    path: EggTimerCore

# Settings that both targets need, in one place. The team is the Apple
# Developer Program membership; without it the time-sensitive entitlement
# cannot be signed and the alarm cannot cut through a Focus mode.
settings:
  base:
    DEVELOPMENT_TEAM: L4D3TWC3A4
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    # Same number as package.json, less its pre-release tag: Apple takes only
    # up to three integers here ("0.3.0", never "0.3.0-alpha.1"), so the alpha
    # lives in package.json and the git tag. Two version schemes for one program
    # is one more than anybody can keep straight; test/tools/version.test.ts holds
    # them together.
    MARKETING_VERSION: "0.5.1"
    CURRENT_PROJECT_VERSION: "3"
    # The simulator needs no identity and must not wait on one: keeping it
    # unsigned is what makes the build-run-screenshot loop two seconds. Device
    # builds sign normally, which is what the entitlement requires.
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
    CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: NO

targets:
  ActualEggTimer:
    type: application
    platform: iOS
    # The screens and what needs an iPhone (notifications, sound, the Lock
    # Screen, App Attest). The logic under them is the package's EggTimerApp,
    # which the tests there drive (ios/EggTimerCore/Package.swift).
    sources:
      - path: App
      # The words: copy/<locale>.json from the repo root, the same files the
      # web app fetches, as a folder in the bundle (Bundle.main, "copy/en.json").
      # A folder reference rather than a group, so a new language is a new file
      # and not a project change. Rendered by EggTimerCopy - see EggTimerShared's Copy.swift.
      # All of it ships but the notes beside the catalogue, which the last
      # build phase takes out again (below); the approved record is in
      # test/data (en1750.test.ts).
      - path: ../copy
        type: folder
        buildPhase: resources
      # The population a new cook's prior is drawn from: the same file
      # the web app fetches, bundled as population.json (Calibration.swift).
      - path: ../fixtures/population.json
        buildPhase: resources
      # Help's sources, citations and their addresses: the same file the web
      # app bundles, bundled as help-sources.json (HelpView.swift).
      - path: ../help-sources.json
        buildPhase: resources
    # copy/*.notes.json is the tools' and the tests', never the app's: a folder
    # reference cannot leave a file out, so it is deleted from the bundle once
    # the resources are in, before signing.
    postBuildScripts:
      - name: Leave out the catalogue's notes
        script: rm -f "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/copy/"*.notes.json
        basedOnDependencyAnalysis: false
    dependencies:
      - package: EggTimerCore
        product: EggTimerCore
      - package: EggTimerCore
        product: EggTimerCopy
      - package: EggTimerCore
        product: EggTimerShared
      - package: EggTimerCore
        product: EggTimerApp
      - target: EggTimerWidget
    # A shared scheme, so xcodebuild (and anything driving it) can find the
    # target without Xcode having opened the project first and invented one.
    scheme:
      # `npm run ios:e2e` and `npm run ios:shots` run them (tools/iosE2e.ts).
      testTargets: [EggTimerUITests]
      # Unticked in Edit Scheme > Run > Arguments, for a run from Xcode to
      # tick: the alarms without a cook, to hear them (ios/README.md,
      # "Hearing the alarms in seconds"). Only a run passes them, never an
      # archive, and only a debug build has `-alarmTest`.
      commandLineArguments:
        "-alarmTest 10": false
        "-alarmTest 30": false
        "-alarmSound timer": false
        "-alarmSound cuckoo": false
        "-alarmSound hen": false
    # The languages the App Store lists. An array, which the INFOPLIST_KEY_*
    # settings below cannot express, so xcodegen writes this much of the plist
    # (App/Info.plist, generated and gitignored like the widget's) and the build
    # merges the generated keys into it. The language subtag of each of core's
    # LANGUAGES (src/core/copy.ts), held to it by test/languages.test.ts;
    # English only until Czech ships.
    #
    # The face of the English of 1750 (App/PeriodFace.swift), an array too.
    # App/Fonts, copied to the bundle's root with its licence. The app's
    # alone: the Live Activity keeps the system face.
    info:
      path: App/Info.plist
      properties:
        CFBundleLocalizations: [en]
        UIAppFonts: [IMFeENrm28P.ttf, IMFeENit28P.ttf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: name.danmackinlay.actualeggtimer
        # iPhone only. A universal app that is portrait-only
        # is refused at upload (ITMS-90474): iPad multitasking wants every
        # orientation. An iPad still runs it, in iPhone compatibility mode.
        # Per target, since xcodegen gives each iOS target "1,2" by default.
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: Actual Egg Timer
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The web's --accent (styles.css), light and dark, as the app's tint:
        # Start, links, the clause underlines. App/Assets.xcassets/AccentColor;
        # the widget has its own copy, since an extension has its own bundle.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Actual Egg Timer
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        # Without this the system refuses to start a Live Activity at all.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        # Answered here rather than per build in App Store Connect. When a
        # person turns sharing on, the app sends results over HTTPS through
        # URLSession to its own site, and hashes with SHA-256 for App Attest
        # (ShareNetwork.swift, Sharing.swift). Both are the operating system's
        # encryption and exempt, so NO - "no non-exempt encryption" - is the honest answer
        # (Apple's "Complying with encryption export regulations", checked
        # 3 October 2026). Without the key every upload arrives as "Missing
        # Compliance" and has to be answered by hand before testers can install
        # it. Revisit if the app ever encrypts anything itself.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_ENTITLEMENTS: App/ActualEggTimer.entitlements

  # WidgetKit extension. It exists only to draw the Live Activity: the Lock
  # Screen and Dynamic Island countdown. It deliberately does NOT depend on
  # EggTimerCore - the physics has already run in the app by the time anything
  # here is asked to draw, and an extension that cannot solve cannot be wrong.
  # It does need the words, so it links EggTimerCopy, the catalogue renderer,
  # which is a separate library for exactly this reason, and EggTimerShared,
  # the catalogue as loaded and the card's contract (CookActivity), and
  # bundles its own copy of the catalogue: an extension's Bundle.main is not
  # the app's.
  EggTimerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: ../copy
        type: folder
        buildPhase: resources
    # The notes come out of its copy too, as from the app's.
    postBuildScripts:
      - name: Leave out the catalogue's notes
        script: rm -f "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/copy/"*.notes.json
        basedOnDependencyAnalysis: false
    dependencies:
      - package: EggTimerCore
        product: EggTimerCopy
      - package: EggTimerCore
        product: EggTimerShared
    # An extension needs a real Info.plist: NSExtension is a nested dictionary,
    # and the INFOPLIST_KEY_* build settings that generate a plist can only
    # express flat values - the key is silently dropped, and the result is an
    # extension the system does not recognise as a widget at all. So xcodegen
    # writes this one, from here. Widget/Info.plist is generated and gitignored
    # for the same reason the pbxproj is.
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Egg Timer
        # An extension whose version does not match its host app is refused at
        # install time, so both read the same project-level settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: name.danmackinlay.actualeggtimer.widget
        # As the app's: an extension's family must not be wider than its host's.
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: EggTimerWidget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES

  # The app driven on a simulator as a finger would: its buttons tapped by
  # their accessibility identifiers, its clock stepped and its debug log read
  # through a directory on the Mac (`-debugDir`, Screenshots.swift), which a
  # simulator's app and its tests both reach. A Debug build only: the clock's
  # and the log's launch arguments are a debug build's. It links the app's
  # logic to read the log by its own types (`Screenshots.Event`, the stored
  # cook). `npm run ios:e2e` and `npm run ios:shots` run it, a scenario to a
  # fresh install (tools/iosE2e.ts).
  EggTimerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ActualEggTimer
      - package: EggTimerCore
        product: EggTimerCore
      - package: EggTimerCore
        product: EggTimerApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: name.danmackinlay.actualeggtimer.uitests
        TEST_TARGET_NAME: ActualEggTimer
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
